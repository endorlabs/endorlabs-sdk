name: 'Setup Python with UV'
description: 'Setup Python and UV with dependency caching for Endor Labs SDK'
inputs:
  python-version:
    description: 'Python version to use'
    required: true
    default: '3.13'
  uv-version:
    description: 'UV version to install'
    required: false
    default: '0.13.6'
  install-dependencies:
    description: 'Whether to install dependencies'
    required: false
    default: 'true'
runs:
  using: 'composite'
  steps:
    - name: Install UV
      uses: astral-sh/setup-uv@0192b6951893e558e24cfbd971d641a8cd336a95 # v10.3.2 + 0.13.6 checksums
      with:
        version: ${{ inputs.uv-version }}
        python-version: ${{ inputs.python-version }}
        enable-cache: true
        cache-dependency-glob: |
          **/pyproject.toml
          **/uv.lock

    - name: Install dependencies (dev only)
      if: inputs.install-dependencies == 'true'
      shell: bash
      run: |
        set -euo pipefail
        echo "Installing dependencies via PyPI..."
        uv sync --dev
